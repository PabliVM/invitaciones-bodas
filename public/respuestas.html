<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Respuestas · Wedding Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .main { margin: 0 auto; }
    .btn { padding: 8px 14px; border: none; font-family: inherit; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-block; }
    .cargando, .vacio { text-align: center; padding: 32px; }
    .vacio__sub { font-size: 13px; }
  </style>
  <link rel="stylesheet" href="css/premium.css" />
</head>
<body>

  <header class="header">
    <div>
      <a href="index.html" class="header__logo">Wedding Builder</a>
      <div class="header__sub">Respuestas de invitados</div>
    </div>
    <div class="header__usuario">
      <span class="header__email" id="usuario-email"></span>
      <button class="btn btn--secundario" id="btn-logout" onclick="DB.logout()">Salir</button>
    </div>
  </header>

  <main class="main">
    <a href="index.html" class="volver">← Tus bodas</a>
    <p class="main__titulo" id="titulo-boda">Respuestas</p>

    <div id="respuestas-container">
      <div class="cargando">Cargando…</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/respuestas-vista.js"></script>

  <script>
    DB.init();

    var _bodaId = new URLSearchParams(window.location.search).get('id');

    async function cargar() {
      var cont = document.getElementById('respuestas-container');
      if (!_bodaId) { cont.innerHTML = '<div class="vacio"><p class="vacio__texto">Falta el id de la boda.</p></div>'; return; }
      try {
        var res = await Promise.all([DB.cargarBoda(_bodaId), DB.listarRespuestas(_bodaId)]);
        var boda = res[0];
        if (!boda) { cont.innerHTML = '<div class="vacio"><p class="vacio__texto">Boda no encontrada.</p></div>'; return; }
        var nombre = (boda.meta && boda.meta.titulo) || ((boda.pareja && (boda.pareja.novio + ' & ' + boda.pareja.novia)) || 'boda');
        document.getElementById('titulo-boda').textContent = nombre;
        document.title = 'Respuestas · ' + nombre;
        RESPUESTAS_VISTA.pintar(cont, res[1], nombre);
      } catch (err) {
        console.error(err);
        cont.innerHTML = '<div class="cargando">Error al cargar. Revisa la consola.</div>';
      }
    }

    DB.requireAdmin().then(function(user) {
      document.getElementById('usuario-email').textContent = user.email;
      cargar();
    });
  </script>
</body>
</html>
