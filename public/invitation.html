<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f0e8" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Estás invitado a nuestra boda" id="og-title" />
  <meta property="og:description" content="Abre para ver todos los detalles de nuestra celebración." id="og-description" />
  <meta property="og:image" content="" id="og-image" />
  <meta property="og:url" content="" id="og-url" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="" id="tw-title" />
  <meta name="twitter:description" content="" id="tw-description" />
  <meta name="twitter:image" content="" id="tw-image" />
  <title>Invitación de boda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/invitacion.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: #f5f0e8; }

    #pantalla-error { display: none; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 32px; text-align: center; font-family: Georgia, serif; color: #6b6255; }
    .error-titulo { font-size: 28px; color: #b8860b; }
    .error-texto { font-size: 16px; line-height: 1.7; font-style: italic; }

    #pantalla-carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 200; transition: opacity .5s; }
    #pantalla-carga.oculto { opacity: 0; pointer-events: none; }
    .carga-ornamento { font-size: 24px; color: #b8860b; }
    .carga-texto { font-family: sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #aaa; }
  </style>
  <link rel="stylesheet" href="/css/magia.css" />
</head>
<body>

  <div id="pantalla-carga">
    <div class="carga-ornamento">✦</div>
    <div class="carga-texto">Cargando invitación…</div>
  </div>
  <div id="pantalla-error">
    <div class="error-titulo">✦</div>
    <p class="error-texto">No hemos encontrado esta invitación.<br>Puede que el enlace sea incorrecto.</p>
  </div>

  <div id="invitation-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/invitacion.js"></script>
  <script src="/js/demos.js"></script>
  <script src="/js/magia.js"></script>

  <script>
    var PARAMS = new URLSearchParams(window.location.search);
    var PREVIEW = PARAMS.get('preview') === '1';
    // Ejemplos: /ejemplos/<plantilla> (ruta limpia) o ?demo=<plantilla>
    var DEMO = PARAMS.get('demo') || (window.location.pathname.match(/^\/ejemplos\/([a-z]+)\/?$/) || [])[1];
    var raiz = document.getElementById('invitation-root');
    var pantallaCarga = document.getElementById('pantalla-carga');

    function mostrarError() {
      pantallaCarga.classList.add('oculto');
      document.getElementById('pantalla-error').style.display = 'flex';
    }

    function actualizarOG(boda) {
      var p = boda.pareja || {};
      var titulo = 'Boda de ' + (p.novio || '') + ' & ' + (p.novia || '');
      var foto = boda.fotoCabecera || ((boda.galeria && boda.galeria.fotos && boda.galeria.fotos[0]) || '');
      document.title = titulo;
      var set = function(id, v) { var e = document.getElementById(id); if (e && v) e.setAttribute('content', v); };
      set('og-title', titulo); set('og-image', foto); set('og-url', window.location.href);
      set('tw-title', titulo); set('tw-image', foto);
    }

    if (DEMO) {
      // Ejemplo para la web pública: datos de muestra, los formularios no envían nada
      var demo = DEMOS.boda(DEMO);
      document.title = 'Ejemplo · ' + demo.pareja.novio + ' & ' + demo.pareja.novia;
      INVITACION.render(demo, raiz, {
        onRsvp: function() { return Promise.resolve(); },
        onFormulario: function() { return Promise.resolve(); }
      });
      setTimeout(function() { pantallaCarga.classList.add('oculto'); }, 200);
    } else if (PREVIEW) {
      // Vista previa del editor: recibe la boda por postMessage (mismo origen)
      pantallaCarga.classList.add('oculto');
      var desplazamiento = 0;
      window.addEventListener('message', function(e) {
        if (e.origin !== window.location.origin || !e.data || e.data.tipo !== 'boda') return;
        desplazamiento = window.scrollY;
        INVITACION.render(e.data.boda, raiz, { preview: true });
        window.scrollTo(0, desplazamiento);
      });
      window.parent.postMessage({ tipo: 'preview-listo' }, window.location.origin);
    } else {
      DB.init();
      (async function() {
        var id = PARAMS.get('id');
        if (!id) return mostrarError();
        try {
          var boda = await DB.cargarBodaPublica(id);
          if (!boda) return mostrarError();
          actualizarOG(boda);
          INVITACION.render(boda, raiz, {
            onRsvp: function(datos) { return DB.enviarRSVP(boda.id || id, datos); },
            onFormulario: function(respuestas) { return DB.enviarFormulario(boda.id || id, respuestas); }
          });
          setTimeout(function() { pantallaCarga.classList.add('oculto'); }, 300);
        } catch (err) {
          console.error(err);
          mostrarError();
        }
      })();
    }
  </script>
</body>
</html>
