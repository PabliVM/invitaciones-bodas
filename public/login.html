<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Acceso · yourdate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/premium.css" />
</head>
<body class="login">

  <main class="login-card">
    <div class="login-card__logo"><span class="marca"><span class="marca__your">your</span><span class="marca__date">date</span></span></div>
    <div class="login-card__sub">Acceso administración</div>
    <form id="form-login">
      <div class="campo">
        <label class="campo__label" for="inp-email">Email</label>
        <input type="email" class="campo__input" id="inp-email" autocomplete="username" required />
      </div>
      <div class="campo">
        <label class="campo__label" for="inp-password">Contraseña</label>
        <input type="password" class="campo__input" id="inp-password" autocomplete="current-password" required />
      </div>
      <div class="login-card__error" id="login-error"></div>
      <button type="submit" class="btn btn--primario" id="btn-entrar">Entrar</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script>
    DB.init();

    // Solo páginas internas (evita redirecciones a otros dominios)
    function destino() {
      var next = new URLSearchParams(window.location.search).get('next') || '';
      return /^[a-z0-9_-]+\.html([?#].*)?$/i.test(next) ? next : 'index.html';
    }

    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('btn-entrar');
      var err = document.getElementById('login-error');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        await DB.login(
          document.getElementById('inp-email').value.trim(),
          document.getElementById('inp-password').value
        );
        window.location.replace(destino());
      } catch (ex) {
        err.textContent = ex.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : ex.message;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
