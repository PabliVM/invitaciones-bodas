<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
      --text: #e0e0e0; --text-muted: #666;
      --accent: #b8860b; --accent-hover: #d4a017; --danger: #c0392b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; min-height: 100vh; }
    .header { border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
    .header__logo { font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
    .header__sub { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }
    .main { max-width: 960px; margin: 0 auto; padding: 48px 32px; }
    .main__titulo { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 24px; }
    .card-nueva { border: 2px dashed var(--border); padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s; margin-bottom: 24px; }
    .card-nueva:hover { border-color: var(--accent); }
    .card-nueva__icono { font-size: 28px; color: var(--accent); margin-bottom: 12px; }
    .card-nueva__texto { font-size: 14px; color: var(--text-muted); }
    .bodas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .boda-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; transition: border-color 0.2s; }
    .boda-card:hover { border-color: #444; }
    .boda-card__nombres { font-size: 18px; font-weight: 300; color: var(--text); margin-bottom: 6px; }
    .boda-card__meta { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.6; }
    .boda-card__acciones { display: flex; gap: 8px; }
    .btn { padding: 8px 14px; border: none; font-family: inherit; font-size: 12px; font-weight: 400; cursor: pointer; transition: all 0.15s; text-decoration: none; display: inline-block; }
    .btn--primario { background: var(--accent); color: #fff; flex: 1; text-align: center; }
    .btn--primario:hover { background: var(--accent-hover); }
    .btn--secundario { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn--secundario:hover { color: var(--text); border-color: #444; }
    .btn--peligro { background: transparent; color: var(--danger); border: 1px solid transparent; padding: 8px 10px; }
    .btn--peligro:hover { border-color: var(--danger); }
    .cargando { text-align: center; padding: 48px; color: var(--text-muted); font-size: 13px; }
    .vacio { text-align: center; padding: 48px; color: var(--text-muted); }
    .vacio__texto { font-size: 14px; margin-bottom: 8px; }
    .vacio__sub { font-size: 12px; color: #444; }
  </style>
  <link rel="stylesheet" href="css/premium.css" />
</head>
<body>

  <header class="header">
    <div>
      <div class="header__logo">Wedding Builder</div>
      <div class="header__sub">Panel de gestión</div>
    </div>
    <div class="header__usuario">
      <a href="solicitudes.html" class="btn btn--ghost header__solicitudes">Solicitudes <span class="badge" id="badge-solicitudes" hidden></span></a>
      <span class="header__email" id="usuario-email"></span>
      <button class="btn btn--secundario" id="btn-logout" onclick="DB.logout()">Salir</button>
    </div>
  </header>

  <main class="main">
    <p class="main__titulo">Tus bodas</p>
    <div class="card-nueva" id="btn-nueva-boda">
      <div class="card-nueva__icono">＋</div>
      <div class="card-nueva__texto">Crear nueva boda</div>
    </div>
    <div class="pestanas" id="pestanas">
      <button class="pestana activa" data-vista="activas" onclick="cambiarVista('activas')">Activas <span id="cnt-activas"></span></button>
      <button class="pestana" data-vista="archivadas" onclick="cambiarVista('archivadas')">Archivadas <span id="cnt-archivadas"></span></button>
    </div>
    <div id="bodas-container">
      <div class="cargando">Cargando…</div>
    </div>
  </main>

  <!-- Accesos de novios -->
  <div class="modal" id="modal-novios" hidden>
    <div class="modal__caja" role="dialog" aria-modal="true" aria-labelledby="modal-novios-titulo">
      <button class="modal__cerrar" onclick="cerrarNovios()" aria-label="Cerrar">✕</button>
      <h2 class="modal__titulo" id="modal-novios-titulo">Acceso de los novios</h2>
      <p class="modal__texto">Los novios entran en <strong id="url-novios"></strong> con su email y ven solo las respuestas de su boda. Sin contraseñas: reciben un enlace por correo.</p>
      <form class="modal__form" id="form-novios">
        <input type="email" class="campo__input" id="inp-email-novios" placeholder="email@ejemplo.com" required />
        <button class="btn btn--primario" type="submit" id="btn-dar-acceso">Dar acceso</button>
      </form>
      <p class="modal__msg" id="msg-novios" hidden></p>
      <div id="lista-novios"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="js/db.js"></script>

  <script>
    DB.init();

    document.getElementById('btn-nueva-boda').addEventListener('click', function() {
      window.location.href = 'editor.html';
    });

    var _bodas = [];
    var _vista = 'activas';

    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    async function cargarBodas() {
      var container = document.getElementById('bodas-container');
      try {
        _bodas = await DB.listarBodas();
        pintarBodas();
      } catch (err) {
        container.innerHTML = '<div class="cargando">Error al cargar. Revisa la consola.</div>';
        console.error(err);
      }
    }

    function cambiarVista(vista) {
      _vista = vista;
      document.querySelectorAll('.pestana').forEach(function(p) {
        p.classList.toggle('activa', p.getAttribute('data-vista') === vista);
      });
      pintarBodas();
    }

    function pintarBodas() {
      var container = document.getElementById('bodas-container');
      var archivadas = _vista === 'archivadas';
      var nArch = _bodas.filter(function(b) { return b.archivada; }).length;
      document.getElementById('cnt-activas').textContent = _bodas.length - nArch;
      document.getElementById('cnt-archivadas').textContent = nArch;

      var bodas = _bodas.filter(function(b) { return !!b.archivada === archivadas; });
      if (bodas.length === 0) {
        container.innerHTML = archivadas
          ? '<div class="vacio"><p class="vacio__texto">No hay bodas archivadas.</p><p class="vacio__sub">Archiva las bodas que ya se han celebrado.</p></div>'
          : '<div class="vacio"><p class="vacio__texto">Aún no hay bodas creadas.</p><p class="vacio__sub">Crea la primera con el botón de arriba.</p></div>';
        return;
      }
      var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      var html = '<div class="bodas-grid">';
      for (var i = 0; i < bodas.length; i++) {
        var b = bodas[i];
        var nombre = (b.meta && b.meta.titulo) ? b.meta.titulo : ((b.pareja) ? ((b.pareja.novio || '—') + ' & ' + (b.pareja.novia || '—')) : 'Sin nombre');
        var fechaMes = (b.fecha && b.fecha.mes) ? meses[parseInt(b.fecha.mes) - 1] : '—';
        var fechaStr = b.fecha ? (b.fecha.dia + ' ' + fechaMes + ' ' + b.fecha.anio) : '—';
        var creadoEn = b.creadoEn ? new Date(b.creadoEn).toLocaleDateString('es-ES') : '—';
        var id = esc(b.id);
        html += '<div class="boda-card' + (b.archivada ? ' boda-card--archivada' : '') + '">';
        html += '<div class="boda-card__nombres">' + esc(nombre) + '</div>';
        html += '<div class="boda-card__meta">Fecha: ' + esc(fechaStr) + '<br>Creada: ' + creadoEn + '</div>';
        html += '<div class="boda-card__acciones">';
        html += '<a href="editor.html?id=' + id + '" class="btn btn--primario">Editar</a>';
        html += '<a href="invitation.html?id=' + id + '" target="_blank" class="btn btn--secundario">Ver</a>';
        html += '<a href="respuestas.html?id=' + id + '" class="btn btn--secundario">Respuestas</a>';
        html += '<button class="btn btn--secundario" onclick="abrirNovios(\'' + id + '\', this)">Novios</button>';
        html += '</div>';
        html += '<div class="boda-card__extra">';
        html += '<button class="btn btn--ghost" onclick="duplicar(\'' + id + '\', this)">Duplicar</button>';
        html += '<button class="btn btn--ghost" onclick="archivar(\'' + id + '\', ' + !b.archivada + ')">' + (b.archivada ? 'Restaurar' : 'Archivar') + '</button>';
        html += '<button class="btn btn--peligro" onclick="eliminar(\'' + id + '\')" title="Eliminar">✕</button>';
        html += '</div></div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    async function duplicar(id, btn) {
      btn.disabled = true; btn.textContent = 'Duplicando…';
      try {
        var nuevoId = await DB.duplicarBoda(id);
        window.location.href = 'editor.html?id=' + nuevoId;
      } catch (err) {
        console.error(err);
        alert('No se pudo duplicar la boda.');
        btn.disabled = false; btn.textContent = 'Duplicar';
      }
    }

    async function archivar(id, archivada) {
      try {
        await DB.archivarBoda(id, archivada);
        _bodas.forEach(function(b) { if (b.id === id) b.archivada = archivada; });
        pintarBodas();
      } catch (err) {
        console.error(err);
        alert('No se pudo ' + (archivada ? 'archivar' : 'restaurar') + ' la boda.');
      }
    }

    // ── Accesos de novios ──
    var _bodaNovios = null;

    function msgNovios(txt, error) {
      var m = document.getElementById('msg-novios');
      m.textContent = txt || '';
      m.hidden = !txt;
      m.classList.toggle('modal__msg--error', !!error);
    }

    async function pintarNovios() {
      var cont = document.getElementById('lista-novios');
      cont.innerHTML = '<div class="cargando">Cargando…</div>';
      try {
        var res = await DB.apiNovios('GET', { boda: _bodaNovios });
        if (!res.accesos.length) { cont.innerHTML = '<p class="vacio__sub">Nadie tiene acceso todavía.</p>'; return; }
        cont.innerHTML = '<ul class="accesos">' + res.accesos.map(function(a) {
          var ultimo = a.ultimoAcceso ? 'Último acceso: ' + new Date(a.ultimoAcceso).toLocaleDateString('es-ES') : 'Aún no ha entrado';
          return '<li><div><strong>' + esc(a.email) + '</strong><span>' + ultimo + '</span></div>' +
            '<button class="btn btn--peligro" data-email="' + esc(a.email) + '">Quitar</button></li>';
        }).join('') + '</ul>';
        cont.querySelectorAll('[data-email]').forEach(function(b) {
          b.addEventListener('click', async function() {
            if (!confirm('¿Quitar el acceso a ' + b.dataset.email + '?')) return;
            try { await DB.apiNovios('DELETE', { boda: _bodaNovios, email: b.dataset.email }); msgNovios('Acceso retirado.'); pintarNovios(); }
            catch (err) { msgNovios(err.message, true); }
          });
        });
      } catch (err) {
        cont.innerHTML = '';
        msgNovios(err.message, true);
      }
    }

    function abrirNovios(id) {
      _bodaNovios = id;
      document.getElementById('url-novios').textContent = window.location.host + '/novios';
      msgNovios('');
      document.getElementById('modal-novios').hidden = false;
      document.getElementById('inp-email-novios').focus();
      pintarNovios();
    }

    function cerrarNovios() { document.getElementById('modal-novios').hidden = true; }
    document.getElementById('modal-novios').addEventListener('click', function(e) { if (e.target === this) cerrarNovios(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') cerrarNovios(); });

    document.getElementById('form-novios').addEventListener('submit', async function(e) {
      e.preventDefault();
      var inp = document.getElementById('inp-email-novios');
      var btn = document.getElementById('btn-dar-acceso');
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        var res = await DB.apiNovios('POST', { boda: _bodaNovios, email: inp.value.trim() });
        msgNovios(res.aviso || 'Acceso dado. Le hemos enviado el enlace por email.', !!res.aviso);
        inp.value = '';
        pintarNovios();
      } catch (err) { msgNovios(err.message, true); }
      btn.disabled = false; btn.textContent = 'Dar acceso';
    });

    async function eliminar(id) {
      if (!confirm('¿Eliminar esta boda? Esta acción no se puede deshacer.')) return;
      await DB.eliminarBoda(id);
      cargarBodas();
    }

    DB.requireAdmin().then(function(user) {
      document.getElementById('usuario-email').textContent = user.email;
      cargarBodas();
      DB.contarSolicitudesNuevas().then(function(n) {
        var b = document.getElementById('badge-solicitudes');
        if (n > 0) { b.textContent = n; b.hidden = false; }
      });
    });
  </script>

</body>
</html>
